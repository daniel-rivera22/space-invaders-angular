<form [formGroup]="preferencesForm" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label for="number-of-ufos" class="form-label">Number of UFOs</label>
    <select id="number-of-ufos" formControlName="numberOfUfos" class="form-select">
      <option [ngValue]="1">1</option>
      <option [ngValue]="5">5</option>
      <option [ngValue]="9">9</option>
    </select>
  </div>

  <div class="mb-3">
    <label for="time" class="form-label">Time (s)</label>
    <input
      type="number"
      id="time"
      formControlName="time"
      min="60"
      max="180"
      step="60"
      class="form-control"
    />
  </div>

  <div class="form-check mb-3">
    <label for="double-speed" class="form-check-label">Double speed</label>
    <input
      type="checkbox"
      id="double-speed"
      formControlName="doubleSpeed"
      class="form-check-input"
    />
  </div>

  <button type="submit" class="btn btn-primary w-100" [disabled]="preferencesForm.invalid">
    Play
  </button>
</form>
