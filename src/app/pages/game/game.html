<div
  #gameContainer
  class="position-relative w-100 h-100 d-flex justify-content-center align-items-center bg-black"
>
  <canvas
    #gameCanvas
    class="d-block game-canvas"
    tabindex="0"
    (keydown)="onKeyDown($event)"
    (keyup)="onKeyUp($event)"
  ></canvas>

  <div class="position-absolute top-0 end-0 p-3 text-white">
    <h4 class="m-0 fw-bold font-monospace">Tiempo: {{ timeRemaining }}</h4>
  </div>

  <div class="position-absolute bottom-0 end-0 p-3 text-white">
    <h3 class="m-0 fw-bold font-monospace">Score: {{ score }}</h3>
  </div>

@if (isGameOver) {
  <app-game-over
    [score]="gameService.finalScore"
    [ufos]="gameService.gamePreferences.UFOS_TO_DEPLOY"
    [disposedTime]="gameService.gamePreferences.DISPOSED_TIME"
    (save)="onSaveAndExit()"
    (exit)="onExit()"
  >
  </app-game-over>
}
  
</div>
