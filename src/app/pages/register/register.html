<form
  [formGroup]="registerForm"
  class="border rounded p-4 bg-light d-flex flex-column gap-3 bg-dark text-white"
>
  <h3 class="text-warning">Register Form</h3>
  <div class="mb-3">
    <label for="username" class="form-label">Username:</label>
    <input 
      type="text" 
      id="username" 
      name="username" 

      formControlName="username"

      class="form-control" 
      placeholder="Username" />
  </div>

  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input 
      type="email" 
      id="email" 
      name="email" 

      formControlName="email"

      class="form-control" 
      placeholder="aaaaa@aaa.aaa" />
  </div>

  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input 
      type="password" 
      id="password"
      name="password"

      formControlName="password"

      class="form-control" 
      placeholder="Password" />
  </div>

  <div class="mb-3">
    <label for="confirm-password" class="form-label">Repeat password</label>
    <input
      type="password"
      id="confirm-password"
      name="confirm-password"

      formControlName="confirmPassword"

      class="form-control"
      placeholder="Repeat your password"
    />
  </div>

  <button type="submit" class="btn btn-primary w-100">Sign in</button>
</form>
